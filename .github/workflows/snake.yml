# Draws a snake eating the contribution graph, in the README's "Nusantara Night" colours.
# The SVGs are pushed to the `output` branch, which the README links to.
name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *" # every day at 07:00 WIB
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#f4c36a&color_dots=#12162d,#3a3266,#6b4f8f,#c08a4c,#f4c36a
            dist/snake-light.svg?color_snake=#b7791f&color_dots=#ebedf0,#f6e3b8,#ecc56f,#d4952f,#9c5d12

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
