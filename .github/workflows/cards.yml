# Draws the Valorant-style cards the README links to: The Range, rank card and career card.
# The SVGs are pushed to the `output` branch, which the README links to.
name: Profile cards

on:
  schedule:
    - cron: "0 0 * * *" # every day at 07:00 WIB
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rank card
        run: node .github/scripts/rank-card.mjs ${{ github.repository_owner }} dist/rank.svg

      - name: Career card
        run: node .github/scripts/career-card.mjs ${{ github.repository_owner }} dist/career.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: The Range
        run: node .github/scripts/range-card.mjs ${{ github.repository_owner }} dist/range.svg

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
