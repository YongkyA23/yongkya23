<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Victory. Thanks for stopping by, see you next match.">
<title>Victory</title>
<style>@font-face{font-family:'Anton';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Rajdhani';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
.d{font-family:'Anton',Impact,'Arial Narrow',sans-serif;font-weight:400}
.h6{font-family:'Rajdhani','Arial Narrow',sans-serif;font-weight:600}
.h7{font-family:'Rajdhani','Arial Narrow',sans-serif;font-weight:700}
.m{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;font-weight:500}
.v{opacity:0;transform-origin:600px 120px;animation:v .8s .2s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes v{from{opacity:0;transform:scale(1.35)}to{opacity:1;transform:none}}
.ln{transform-origin:600px 0;transform:scaleX(0);animation:ln .9s .5s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes ln{to{transform:scaleX(1)}}
.fade{opacity:0;animation:fade .6s 1s forwards}
@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.v,.fade{opacity:1}.ln{transform:none}}
</style>
<defs>
  <clipPath id="card"><path d="M28 0H1200V222L1172 250H0V28Z"/></clipPath>
  <linearGradient id="shine" x1="0" x2="1200" y1="0" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#ece8e1"/><stop offset=".46" stop-color="#ece8e1"/><stop offset=".5" stop-color="#ffffff"/><stop offset=".54" stop-color="#ece8e1"/><stop offset="1" stop-color="#ece8e1"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1200 0;1200 0" dur="4s" begin="1.2s" repeatCount="indefinite"/>
  </linearGradient>
</defs>
<g clip-path="url(#card)">
  <rect width="1200" height="250" fill="#0f1923"/>
  <text class="d" x="600" y="300" text-anchor="middle" font-size="380" fill="none" stroke="#2b3b4a" stroke-width="2" opacity=".55">GG</text>
  <polygon points="270,64 960,64 930,164 240,164" fill="#ff4655" opacity=".1"/>
  <text class="h7 fade" x="600" y="48" text-anchor="middle" font-size="20" letter-spacing="4"><tspan fill="#36e6b5">13</tspan><tspan fill="#8a9aa6"> — </tspan><tspan fill="#ff4655">0</tspan><tspan fill="#8a9aa6" font-size="14" dx="14">FLAWLESS</tspan></text>
  <g class="ln"><rect x="180" y="146" width="250" height="3" fill="#ff4655"/><rect x="770" y="146" width="250" height="3" fill="#ff4655"/></g>
  <text class="d v" x="600" y="150" text-anchor="middle" font-size="104" letter-spacing="6" fill="url(#shine)">VICTORY</text>
  <text class="h7 fade" x="600" y="200" text-anchor="middle" font-size="18" letter-spacing="4" fill="#8a9aa6">THANKS FOR STOPPING BY  ·  SEE YOU NEXT MATCH</text>
</g>
<path d="M28.75 0.75H1199.25V221.25L1171.25 249.25H0.75V28.75Z" fill="none" stroke="#2b3b4a" stroke-width="1.5"/>
</svg>