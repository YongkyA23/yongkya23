<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 28" width="1200" height="28" role="img" aria-label="Map rotation: ASCENT, SPLIT, FRACTURE, BIND, BREEZE, ABYSS, LOTUS, SUNSET, PEARL, SUMMIT, ICEBOX, CORRODE, HAVEN">
<style>@font-face{font-family:'Rajdhani';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}
.d{font-family:'Anton',Impact,'Arial Narrow',sans-serif;font-weight:400}
.h6{font-family:'Rajdhani','Arial Narrow',sans-serif;font-weight:600}
.h7{font-family:'Rajdhani','Arial Narrow',sans-serif;font-weight:700}
